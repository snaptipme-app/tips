# SnapTip nginx server block — production hardening reference.
#
# This file is a SNIPPET, not a drop-in. Merge the directives here into the
# existing /etc/nginx/sites-available/snaptip server block (or the equivalent
# location in nginx.conf). Reload nginx after changes:
#
#   sudo nginx -t && sudo systemctl reload nginx
#
# Assumes the express server is on 127.0.0.1:5000 and the React SPA's built
# `dist/` directory lives at /var/www/snaptip/dist.

# ─────────────────────────────────────────────────────────────────────────────
# http {} block (or /etc/nginx/conf.d/00-snaptip-http.conf, included before
# the server block). These directives are server-wide.
# ─────────────────────────────────────────────────────────────────────────────

# Hide the nginx version on response headers and error pages.
server_tokens off;

# Limit any single request body to 10 MB. Profile photo uploads go through
# multer with stricter per-route limits, but this is the hard backstop that
# stops oversized requests at the edge.
client_max_body_size 10m;
client_body_buffer_size 128k;

# Drop slow requests — Slowloris-style mitigation.
client_body_timeout 12s;
client_header_timeout 12s;
keepalive_timeout 30s;
send_timeout 10s;
reset_timedout_connection on;

# Compression. Level 6 is the standard sweet spot — the diminishing returns
# above that don't justify the CPU cost.
gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/xml+rss
    application/rss+xml
    application/atom+xml
    image/svg+xml
    font/ttf
    font/otf
    application/font-woff
    application/font-woff2;

# Per-IP connection / request rate buckets. Tune to your traffic profile.
limit_req_zone  $binary_remote_addr zone=api_general:10m  rate=20r/s;
limit_req_zone  $binary_remote_addr zone=api_login:10m    rate=2r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# ─────────────────────────────────────────────────────────────────────────────
# server {} block — snaptip.me
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name snaptip.me www.snaptip.me;

    # Cloudflare terminates the public TLS, but we still want a real cert at
    # the origin (Full strict mode). Use certbot's certificate.
    ssl_certificate     /etc/letsencrypt/live/snaptip.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/snaptip.me/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5:!3DES:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── Security headers (defense in depth on top of helmet) ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                       always;
    add_header X-Frame-Options           "DENY"                                          always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"               always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(self), interest-cohort=()" always;
    # Cross-origin isolation — uncomment once verified safe with all 3rd-party
    # widgets. Will break tools that embed cross-origin iframes.
    # add_header Cross-Origin-Opener-Policy   "same-origin"   always;
    # add_header Cross-Origin-Resource-Policy "same-origin"   always;

    # Strip the upstream Server header. server_tokens above only affects
    # nginx-emitted responses; this makes sure proxied responses are clean too.
    proxy_hide_header Server;
    proxy_hide_header X-Powered-By;

    # Per-IP connection cap.
    limit_conn conn_per_ip 50;

    # ── Block exploit-scanner paths early ──
    # Hidden files (.env, .git, .htaccess) and common backup/config patterns
    # that have no business being served. Returns 403, no body, no log spam.
    location ~ /\.(env|git|svn|hg|aws|docker|ssh|gnupg) {
        deny all;
        access_log off;
        log_not_found off;
        return 403;
    }
    location ~* \.(?:bak|swp|sql|log|old|orig|save|conf|ini)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 403;
    }
    location = /wp-login.php          { return 410; }
    location = /xmlrpc.php            { return 410; }
    location ~* /(?:phpmyadmin|pma|adminer|mysql) { return 410; }

    # ── /api/admin: only allow via Cloudflare-proxied IPs (defense in depth) ──
    # If you publish your admin panel on a separate subdomain, drop this block;
    # it's belt-and-braces in case someone hits the origin IP directly.
    location ^~ /api/admin/ {
        # Replace with the current CF IP ranges from
        # https://www.cloudflare.com/ips-v4 / .../ips-v6
        # Or use ngx_http_geoip2_module to enforce dynamically.
        # allow 173.245.48.0/20;
        # allow 103.21.244.0/22;
        # ... (keep current)
        # deny all;

        limit_req zone=api_login burst=5 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── /api: rate-limited proxy to express ──
    location /api/ {
        limit_req zone=api_general burst=40 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── /uploads: static profile photos ──
    location /uploads/ {
        alias /var/www/snaptip/server/uploads/;
        autoindex off;
        # Long cache, but allow the 1MB-ish images to be invalidated by changing
        # the URL (filename includes content hash).
        expires 30d;
        add_header Cache-Control "public, immutable";
        # Belt + braces: even if multer or the express layer misbehave, never
        # serve scripts from this user-content directory.
        location ~* \.(?:php|pl|py|jsp|asp|sh|cgi)$ {
            deny all;
        }
    }

    # ── SPA static assets ──
    root /var/www/snaptip/client/dist;

    # Hashed asset bundles get long-cache.
    location ~* ^/assets/.*\.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpg|jpeg|webp|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # SPA routing — every unmatched URL returns index.html so React Router
    # can handle the path client-side.
    location / {
        autoindex off;
        try_files $uri $uri/ /index.html;
    }

    # Don't ever serve dotfiles inside the web root.
    location ~ /\. {
        deny all;
        return 404;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# 80 → 443 redirect (kept minimal so misconfigured clients still upgrade).
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name snaptip.me www.snaptip.me;
    server_tokens off;

    # ACME challenge for Let's Encrypt renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
